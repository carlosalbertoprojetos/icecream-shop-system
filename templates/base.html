{% load static %}

<!DOCTYPE html>
<html lang="pt-br">

    <head>
        <meta charset="UTF-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>{% block title %}{% endblock %}</title>


        <!-- CSS -->
        <!-- <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet"
            integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous"> -->
            <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet" href="{% static 'style.css' %}">
    </head>

    <body>
        <div class="container py-3">
            {% if request.path|slice:":18" == '/checkout-pedido/' %}
            <div class="d-flex justify-content-between align-items-center">
                <a class="link-dark text-decoration-none" href="{% url 'index' %}"><i
                        class="fas fa-arrow-left fa-2x"></i></a>
                <div>
                    <img src="https://via.placeholder.com/200" alt="" width="150">
                    <h2 class="link-dark text-decoration-none">Checkout</h2>
                </div>
            </div>
            {% else %}
            {% include 'components/navbar.html' %}
            {% endif %}

            {% include 'components/message.html' %}

            <div class="wrapper">
                {% block content %}
                {% endblock %}
            </div>
        </div>

        <!-- JS-->
        <script src="https://code.jquery.com/jquery-3.7.1.min.js"
            integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
        <script defer src="https://use.fontawesome.com/releases/v5.15.4/js/all.js"
            integrity="sha384-rOA1PnstxnOBLzCLMcre8ybwbTmemjzdNlILg8O7z1lUkLXozs4DHonlDtnE7fpc"
            crossorigin="anonymous"></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4"
            crossorigin="anonymous"></script>
        <script src="{% static 'javascript.js' %}"></script>

        {% block scripts %}
        {% endblock %}
    </body>

</html>
