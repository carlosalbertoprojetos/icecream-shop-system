{% load static %}

<header id="header" class="header fixed-top">
    <div class="topbar d-flex align-items-center">
        <div class="container d-flex justify-content-end justify-content-md-between pe-2">
            <div class="contact-info d-flex align-items-center">
                <i class="bi bi-phone d-flex align-items-center d-none d-lg-block"><span>(31)
                        99578-1020</span></i>
                <i class="bi bi-clock ms-4 d-none d-lg-flex align-items-center"><span>Seg a Sex: 09:00 - 19:00 e
                        Sábado:
                        09:00 - 13:00</span></i>
            </div>
            <div class="sacola-icon position-relative fs-6 me-3 me-lg-0" id="sacola-icon-container">
                <a href="#">
                    <i id="sacola-icon" class="bi bi-bag fs-5 me-1"></i>
                    <span id="sacola-count"
                        class="position-absolute top-0 start-100 translate-middle badge rounded-circle bg-danger mt-2"
                        style="width: 20px; height: 20px; display: flex; align-items: center; justify-content: center;">
                        {{ quantidade_carrinho|default:0 }}
                    </span>
                </a>
            </div>
        </div>
    </div>
    <div class="branding d-flex align-items-cente">
        <div class="container position-relative d-flex align-items-center justify-content-between">
            <a href="/" class="logo d-flex align-items-center">
                <h2 class="sitename ps-2">A Fábrica</h2>
            </a>
            <nav id="navmenu" class="navmenu">
                <ul>
                    <li><a href="#hero" class="active">Home</a></li>
                    <li><a href="#menu">Menu</a></li>
                    <li><a href="#gallery">Galeria</a></li>
                    <li><a href="#contact">Contato</a></li>
                </ul>
                <i class="mobile-nav-toggle d-xl-none bi bi-list"></i>
            </nav>
        </div>
    </div>
</header>

<script>

    document.addEventListener("DOMContentLoaded", () => {
        const sacolaCount = document.getElementById('sacola-count');
        const sacolaIcone = document.getElementById('sacola-icon');

        // Transforma o valor de innerText para inteiro
        const totalItensInt = parseInt(sacolaCount.innerText, 10);

        // Condicional para console.log
        if (totalItensInt > 0) {
            sacolaIcone.className = 'bi-bag-fill fs-5 me-1';
        } else {
            sacolaIcone.className = 'bi bi-bag fs-5 me-1';
        }
    });

</script>
